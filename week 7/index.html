    <style>
        
       *{margin: 0; padding: 0; padding: 0;box-sizing: border-box;}
        body {font-family:Arial,sans-serif; color: #333;}
        /* Navbar: logo left, links + button right */
  nav {
    display: flex;

    background: #ffb703;

    border: 0;
    padding: 8px 16px;
    border-radius: 6px;
    font-weight: bold;
   }

    display: flex;
    flex-direction:column;

    padding: 16px;

   .cards{
    flex:1 1 200px;
    background:#eef2ff;
    padding:20px;
    border-radius: 10px;
    text-align: center;
   }
   .tab{
     padding: 20px;
    border-radius: 10px;
    text-align: center;
     background: #eef2ff;
    margin-right: 10px;
        }
   #group{
    display: flex;
   }
