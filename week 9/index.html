<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; color: #12203a; }
  /* ---------- MOBILE FIRST (default) ---------- */
  nav {
    display: flex;
    flex-direction: column;   /* stacked on phone */
    align-items: center;
    gap: 8px;
    padding: 14px;
    background: #12203a;
    color: white;
  }
 nav a { color: white; margin: 0 8px; text-decoration: none; }
  .hero { padding: 40px 16px; text-align: center; background: #2f5bea; color: white; }
  .hero h1 { font-size: 1.6rem; }
  .hero img { max-width: 100%; height: auto; margin-top: 16px; border-radius: 12px; }
  .features {
    display: grid;
    grid-template-columns: 1fr;   /* 1 column on phone */
    gap: 16px;
    padding: 20px;
  }
  .box {
     .box { background: #eef2ff; padding: 20px; border-radius: 10px; text-align: center; 
  }
  footer { background: #12203a; color: white; text-align: center; padding: 18px; } 
}
